services:
  sslly-nginx:
    image: ghcr.io/hnrobert/sslly-nginx:latest
    container_name: sslly-nginx
    network_mode: host
    restart: always
    volumes:
      - ./configs:/app/configs
      - ./ssl:/app/ssl
      - ./logs:/app/logs
      - ./static:/app/static
    environment:
      - TZ=Asia/Shanghai
      - LANG=zh_CN.UTF-8
      - LANGUAGE=zh_CN:zh
      - LC_ALL=zh_CN.UTF-8
      # Nginx listen ports (optional)
      # You can override these to run on non-standard ports
      - SSLLY_DEFAULT_HTTP_LISTEN_PORT=80
      - SSLLY_DEFAULT_HTTPS_LISTEN_PORT=443
      # Control API (see docs/API.md) — DISABLED unless an address is set.
      # Uncomment BOTH to expose it, or reverse-proxy the gateway through
      # nginx itself with a proxy.yaml route like:
      #   9080:
      #     - your.domain/api
      # Bind loopback when the only client is the local nginx:
      # - SSLLY_API_HTTP_ADDR=127.0.0.1:9080
      # - SSLLY_API_GRPC_ADDR=127.0.0.1:9081
      # Bootstrap token for the initial admin user, hashed into configs/users.yaml
      # on first boot only:
      # - SSLLY_API_ADMIN_TOKEN=change-me
