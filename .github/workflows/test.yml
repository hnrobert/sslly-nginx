name: Test

on:
  # push:
  #   branches: ["**"]
  #   paths:
  #     - ".github/workflows/test.yml"
  #     - "Dockerfile"
  #     - ".dockerignore"
  #     - "**/*.go"
  #     - "go.mod"
  #     - "go.sum"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/test.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "proto/**"
      - "Makefile"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go with cache
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.25"

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Generate protobuf code
        run: make generate

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run vet
        run: go vet ./...

      - name: Run fmt check
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -s -d .
            exit 1
          fi

      - name: Lint protos
        run: make proto-lint
